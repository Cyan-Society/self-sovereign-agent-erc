title = "Self-Sovereign Agent Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Non-secret placeholders and public on-chain identifiers"
regexTarget = "line"
regexes = [
  '''Bearer <YOUR_LETTA_PASSWORD>''',
  '''(DEPLOYER_PRIVATE_KEY|AGENT_EXECUTOR_PRIVATE_KEY)=0xREPLACE_ME_32_BYTE_HEX_PRIVATE_KEY''',
  '''^TOKENBOUND_ACCOUNT_V3=0xREPLACE_ME_CONTRACT_ADDRESS$''',
  '''^\s*address\s+constant\s+TOKENBOUND_ACCOUNT_V3\s*=\s*0x[0-9a-fA-F]{40};\s*$''',
  '''^\s*"token_id"\s*:''',
]
